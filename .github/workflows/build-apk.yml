name: Build AD78 Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      app_url:
        description: "Public Live URL of your deployed AD78 app (e.g. https://ad78.onrender.com or Cloud Run URL)"
        required: false
        default: ""

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK & accept licenses
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Generate Android Capacitor project
        env:
          CUSTOM_APP_URL: ${{ github.event.inputs.app_url }}
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cp android-apk/capacitor.config.json ./capacitor.config.json
          if [ -n "$CUSTOM_APP_URL" ]; then
            node -e '
              const fs = require("fs");
              const cfg = JSON.parse(fs.readFileSync("./capacitor.config.json", "utf8"));
              const u = new URL(process.env.CUSTOM_APP_URL);
              cfg.server = cfg.server || {};
              cfg.server.url = u.origin;
              cfg.server.allowNavigation = [u.host, "*.run.app", "*.onrender.com", "*.up.railway.app", "accounts.google.com", "*.google.com"];
              fs.writeFileSync("./capacitor.config.json", JSON.stringify(cfg, null, 2));
            '
          fi
          rm -rf android
          npx cap add android

      - name: Configure UPI deep links & MainActivity bridge
        run: |
          node -e '
          const fs = require("fs");
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(manifestPath, "utf8");
          const intents = [
            `<intent><action android:name="android.intent.action.VIEW" /><data android:scheme="upi" /></intent>`,
            `<intent><action android:name="android.intent.action.VIEW" /><data android:scheme="phonepe" /></intent>`,
            `<intent><action android:name="android.intent.action.VIEW" /><data android:scheme="tez" /></intent>`,
            `<intent><action android:name="android.intent.action.VIEW" /><data android:scheme="paytmmp" /></intent>`,
            `<intent><action android:name="android.intent.action.VIEW" /><data android:scheme="whatsapp" /></intent>`
          ].join("\n        ");

          if (xml.includes("</queries>")) {
            xml = xml.replace("</queries>", `        ${intents}\n    </queries>`);
          } else {
            xml = xml.replace("<application", `<queries>\n        ${intents}\n    </queries>\n\n    <application`);
          }
          fs.writeFileSync(manifestPath, xml, "utf8");

          const mainActPath = "android/app/src/main/java/com/ad78/app/MainActivity.java";
          const mainJava = `package com.ad78.app;

import android.content.Intent;
import android.net.Uri;
import android.os.Bundle;
import android.webkit.WebResourceRequest;
import android.webkit.WebView;
import com.getcapacitor.BridgeActivity;
import com.getcapacitor.BridgeWebViewClient;

public class MainActivity extends BridgeActivity {
    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        this.bridge.getWebView().setWebViewClient(new BridgeWebViewClient(this.bridge) {
            @Override
            public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                String url = request.getUrl().toString();
                if (url.startsWith("upi://") || url.startsWith("phonepe://")
                        || url.startsWith("tez://") || url.startsWith("paytmmp://")
                        || url.startsWith("whatsapp://")) {
                    try {
                        startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                    } catch (Exception ignored) {}
                    return true;
                }
                return super.shouldOverrideUrlLoading(view, request);
            }
        });
    }
}
`;
          require("fs").mkdirSync(require("path").dirname(mainActPath), { recursive: true });
          fs.writeFileSync(mainActPath, mainJava, "utf8");
          '
          npx cap sync android

      - name: Build AD78.apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../AD78.apk

      - name: Upload AD78.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD78-APK
          path: AD78.apk
          retention-days: 30
